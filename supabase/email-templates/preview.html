10px;line-height:16px;letter-spacing:1.8px;font-weight:700;color:#1f5bff;\">YOUR NEXT CHAPTER\u003c/p>\n\u003ch1 style=\"margin:0 0 20px;font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.2;font-weight:600;letter-spacing:-0.6px;color:#202b35;\">A world of ideas awaits.\u003c/h1>\n\u003cp style=\"margin:0 0 22px;font-size:14px;line-height:24px;color:#536273;\">Confirm your email address to finish creating your ATLAS account. Your readings, notes and projects will have a place to come back to.\u003c/p>\n\u003cp style=\"margin:0 0 24px;font-size:12px;line-height:21px;color:#536273;word-break:break-word;\">Account: \u003cstrong style=\"color:#202b35;\">student@example.com\u003c/strong>\u003c/p>\n\u003ctable role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" bgcolor=\"#1f5bff\" style=\"border-radius:7px;mso-padding-alt:16px 20px;\">\u003ca href=\"https://example.invalid/auth-preview\" style=\"display:block;padding:16px 20px;color:#ffffff;text-decoration:none;font-size:13px;line-height:20px;font-weight:600;\">Confirm email address&nbsp; &rarr;\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:20px 0 0;font-size:12px;line-height:21px;color:#637083;\">Open this link in the browser where you started the request. It can be used once. If it has expired, return to ATLAS and request a new one.\u003c/p>\u003cp style=\"margin:16px 0 0;font-size:11px;line-height:19px;color:#637083;\">Button not working? \u003ca href=\"https://example.invalid/auth-preview\" style=\"color:#1c4ac7;text-decoration:underline;\">Open the secure link\u003c/a>.\u003c/p>\n\u003cp style=\"margin:28px 0 0;padding-top:22px;border-top:1px solid #deded9;font-size:12px;line-height:21px;color:#637083;\">If you did not create an ATLAS account, you can ignore this email.\u003c/p>\n\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding:20px 28px;background:#f1f3f8;border-top:1px solid #e1e4eb;\">\u003cp style=\"ma
